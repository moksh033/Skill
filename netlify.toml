# Netlify Configuration for MedDesk Frontend
# Root level configuration (when Netlify repository root is the project root)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA routing: Forward all URLs to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
