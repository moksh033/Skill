# Render.com Blueprint — optional, for one-click deploy
# See: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: hospital-support-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false  # Set to your Netlify URL after deploying frontend
      - key: PYTHON_VERSION
        value: "3.11.9"
